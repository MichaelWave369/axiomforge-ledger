<!doctype html><html><head><meta charset='utf-8'><title>AxiomForge Ledger</title><style>body{font-family:ui-monospace,monospace;background:#f2f3ee;color:#1c2430;margin:2rem}.card{background:#fff;border:1px solid #cfd3c8;padding:1rem;margin:1rem 0}.stamp{float:right;border:2px solid #a8321e;color:#a8321e;padding:.25rem .5rem;text-transform:uppercase}textarea{width:100%;height:5rem}button{background:#1c2430;color:#f2f3ee;border:0;padding:.7rem 1rem}</style></head><body><h1>AxiomForge Ledger</h1><p>Receipt-first claim workbench. Nothing is proven unless a real prover says so.</p><textarea id='text'>All prime numbers are odd.</textarea><br><label><input id='sims' type='checkbox' checked> run simulations</label> <button onclick='fileClaim()'>File claim</button><div id='out'></div><script>async function api(p,o){let r=await fetch(p,o);return r.json()}async function load(){let rs=await api('/api/claims');out.innerHTML=rs.reverse().map(r=>`<div class=card><b>${r.original_claim}</b><span class=stamp>${r.current_status}</span><p>${r.assumptions.map(a=>'• '+a).join('<br>')}</p><small>${r.receipt_sha256}</small></div>`).join('')}async function fileClaim(){await api('/api/claims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,run_simulations:sims.checked})});load()}load()</script></body></html>
